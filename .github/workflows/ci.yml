name: VayuPlan CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Clean Dependencies
        run: npm ci

      - name: TypeScript Strict Verification
        run: npm run typecheck

      - name: ESLint Code Quality Scan
        run: npm run lint

      - name: Vitest Unit & Accessibility Test Suite
        run: npm test

      - name: Turbopack Production Build
        run: npm run build
